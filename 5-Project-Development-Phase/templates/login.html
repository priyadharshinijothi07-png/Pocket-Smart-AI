{% extends "base.html" %}
{% block title %}Login - PocketSmart{% endblock %}
{% block content %}
<div class="auth">
  <h1 class="logo">PocketSmart</h1><p class="center">AI-Powered Budget Planning</p>
  <form method="post" class="panel">
    <h2 class="center">Welcome Back</h2>
    <label>Username<input name="username" placeholder="Enter your username" required></label>
    <label>Password<input name="password" type="password" placeholder="Enter your password" required></label>
    <button class="btn full">Login</button>
    <p class="center">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
  </form>
</div>
{% endblock %}
